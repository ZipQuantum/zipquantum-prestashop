name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - if: matrix.php == '8.2'
        run: composer lint
      - if: matrix.php == '8.2'
        run: composer analyse

  package:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab pypdf
      - run: python bin/build_user_guide.py
      - run: php bin/build.php
      - run: unzip -l dist/zipquantum.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zipquantum-marketplace
          path: dist/zipquantum.zip

